<HTML>
<HEAD> <TITLE> Form Elements </TITLE> </HEAD>
<BODY>
<H3> Text Box </H3>
<form>
    First name: <input type="text" name="firstname" /><br />
    Last name: <input type="text" name="lastname">
</form>
<H3> Text Box for Password </H3>
<form>
    Password: <input type="password" name="pwd" />
</form>
<H3> Radio Button </H3>
<form>
    <input type="radio" name="sex" value="male" /> Male<br />
    <input type="radio" name="sex" value="female" /> Female
</form>
<H3> Checkbox </H3>
<form>
    <input type="checkbox" name="subject" value="Computer" />Computer science<br>
    <input type="checkbox" name="subject" value="Hotel Management" />Hotel Management
</form>
<H3> Submit button </H3>
<form name="input" action="html_form_action.asp" method="get">
    Username: <input type="text" name="user" />
</form>
<H3> Drop down menu </H3>
<form action="">
    <select name="Stream">
        <option value="Science">Science</option>
        <option value="Management">Management</option>
        <option value="Humanities">Humanities</option>
        <option value="Education">Education</option>
    </select>
    <input type="submit" value="Submit" />
</form>
</BODY>
</HTML>
